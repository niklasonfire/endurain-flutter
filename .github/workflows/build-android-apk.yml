name: Build Android

on:
  workflow_run:
    workflows: [Local runner CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Stable publishes a release; nightly updates prerelease; check only uploads artifact
        required: true
        type: choice
        options: [check, stable, nightly]
        default: check
      source_commit:
        description: Full SHA with successful complete main push CI
        required: true
        type: string
      version_name:
        description: Stable/check version X.Y.Z (nightly generated automatically)
        type: string
      signing_check_only:
        description: Verify signing credentials without building or publishing
        type: boolean
        default: false

env:
  FLUTTER_VERSION: 3.47.3

# One allocator and publisher for both channels; never cancel a publish halfway.
concurrency:
  group: android-update-publisher
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: >-
      github.repository == 'niklasonfire/endurain-flutter' &&
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
       github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      BUILD_REQUIRED: ${{ steps.prepare.outputs.BUILD_REQUIRED }}
      SOURCE_SHA: ${{ steps.prepare.outputs.SOURCE_SHA }}
      VERSION_NAME: ${{ steps.prepare.outputs.VERSION_NAME }}
      VERSION_CODE: ${{ steps.prepare.outputs.VERSION_CODE }}
      UPDATE_CHANNEL: ${{ steps.prepare.outputs.UPDATE_CHANNEL }}
    steps:
      # workflow_run always uses trusted default-branch release tooling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Gate exact source commit and allocate build number
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'workflow_run' && 'nightly' || inputs.channel }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: python3 .github/scripts/android_updates.py prepare

  build-android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.BUILD_REQUIRED == 'true'
    runs-on: [self-hosted, linux, x64, dind, endurain-flutter]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.SOURCE_SHA }}
      VERSION_NAME: ${{ needs.prepare.outputs.VERSION_NAME }}
      VERSION_CODE: ${{ needs.prepare.outputs.VERSION_CODE }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.UPDATE_CHANNEL }}
      APK_PATH: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Preserve trusted publisher
        run: cp .github/scripts/android_updates.py .github/scripts/classify_ci_changes.py "$RUNNER_TEMP/"
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Flutter
        if: ${{ !inputs.signing_check_only }}
        uses: ./.github/actions/setup-flutter
      - name: Prepare signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_UPLOAD_CERT_SHA256:?Missing ANDROID_UPLOAD_CERT_SHA256 secret}"

          keystore_path="$RUNNER_TEMP/endurain-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          expected_fingerprint="$(
            printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]]
          actual_fingerprint="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" 2>/dev/null |
              awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}'
          )"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]]

          # keytool can ignore a distinct key password for PKCS12. Use the
          # same KeyStore.getKey operation as the APK signer to check it.
          if ! java tool/VerifyAndroidSigning.java "$keystore_path" >/dev/null 2>&1; then
            echo "::error::Cannot unlock the private signing key. Check that ANDROID_KEY_PASSWORD matches the uploaded ANDROID_KEYSTORE_BASE64 keystore." >&2
            exit 1
          fi
          echo "Signing certificate and private key verified."

          [[ "${expected_fingerprint,,}" == "3341bbf406214b746b6f893d12a353652df6c9215feb6b2e58e541c2bb9dfb6e" ]]

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "EXPECTED_CERT_SHA256=$expected_fingerprint"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ !inputs.signing_check_only }}
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -XX:ReservedCodeCacheSize=128m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=1
            -Dkotlin.compiler.execution.strategy=in-process
          JAVA_TOOL_OPTIONS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -XX:ReservedCodeCacheSize=128m
          ENDURAIN_CRASH_REPORTING_DSN: ${{ vars.ENDURAIN_CRASH_REPORTING_DSN }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --target-platform android-arm64 \
            --split-per-abi \
            --android-project-arg=force-version-code-ignoring-abi=true \
            --split-debug-info=build/debug-info \
            --dart-define=ENDURAIN_UPDATE_CHANNEL="$UPDATE_CHANNEL" \
            --dart-define=ENDURAIN_CRASH_REPORTING_DSN="${ENDURAIN_CRASH_REPORTING_DSN:-}"

      - name: Verify APK and create release manifest
        if: ${{ !inputs.signing_check_only }}
        shell: bash
        run: |
          set -euo pipefail
          export APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          export AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          python3 "$RUNNER_TEMP/android_updates.py" manifest

      - name: Upload verified APK and metadata
        if: ${{ !inputs.signing_check_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endurain-${{ env.UPDATE_CHANNEL }}-${{ env.VERSION_CODE }}
          path: |
            ${{ env.APK_PATH }}
            build/update.json
          if-no-files-found: error

      - name: Publish verified release
        if: ${{ !inputs.signing_check_only && needs.prepare.outputs.UPDATE_CHANNEL != 'check' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/android_updates.py" publish

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/endurain-upload-key.jks" "$RUNNER_TEMP/android_updates.py" "$RUNNER_TEMP/classify_ci_changes.py"
