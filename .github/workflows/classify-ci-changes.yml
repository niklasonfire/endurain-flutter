name: Classify CI changes

on:
  workflow_call:
    outputs:
      run_ci:
        description: Whether Flutter and Android checks are needed
        value: ${{ jobs.classify.outputs.run_ci }}
      run_ios:
        description: Whether macOS checks are needed
        value: ${{ jobs.classify.outputs.run_ios }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.changes.outputs.run_ci }}
      run_ios: ${{ steps.changes.outputs.run_ios }}
    steps:
      - name: Checkout history for change comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change classification
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changed files
        id: changes
        run: python3 .github/scripts/classify_ci_changes.py
